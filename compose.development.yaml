# Standalone development deployment. Never combine with production compose.yaml.
name: plusx-development
services:
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    env_file: ./secrets.development/runtime.env
    environment:
      POSTGRES_USER: pulsex
      POSTGRES_DB: pulsex
    volumes:
      - postgres_development_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsex -d pulsex"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      dockerfile: ops/Dockerfile.development
      args:
        PULSEX_SOURCE_SHA: ${PULSEX_SOURCE_SHA:-706884d-development}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./secrets.development/runtime.env
    environment:
      PULSEX_ENV: local
      REQUIRE_POSTGRES: "false"
      SEED_DEMO: "false"
      WEB_WORKERS: "1"
      DATA_DIR: /app/data
      PUBLIC_ORIGIN: https://5.189.157.131
      HOST: 0.0.0.0
      PORT: "4310"
    # REQUIRE_POSTGRES also enables production gates; local mode selects PostgreSQL
    # explicitly without asserting unperformed production acceptance.
    command: ["sh", "-c", 'export DATABASE_URL="postgresql+psycopg://pulsex:$${POSTGRES_PASSWORD}@postgres:5432/pulsex"; python -m tools.migrate_postgres && exec python run.py']
    volumes:
      - plusx_development_data:/app/data
    ports: ["127.0.0.1:14310:4310"]
    healthcheck:
      test: ["CMD", "python", "-m", "tools.app_healthcheck"]
      interval: 10s
      timeout: 8s
      start_period: 90s
      retries: 8
volumes:
  plusx_development_data:
  postgres_development_data:
