# Include only inside the existing HTTPS server. Other host routes are unchanged.
location = /plusx { return 308 /plusx/; }
location ^~ /plusx/ {
    proxy_pass http://127.0.0.1:14310/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Prefix /plusx;
    proxy_redirect / /plusx/;
    proxy_cookie_path / /plusx/;
    # Service workers may only control this application's mount.
    proxy_hide_header Service-Worker-Allowed;
    add_header Service-Worker-Allowed /plusx/ always;
    proxy_read_timeout 300s;
    client_max_body_size 20m;
}
