name: Certificate service acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: certificates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONUTF8: '1'
  PX_CERTIFICATE_TEST_EVIDENCE_DIR: qa/certificates
  PX_ALLOW_CERTIFICATE_TEST_DATABASES: 'YES'
  PX_CERTIFICATE_TEST_ADMIN_URL: postgresql+psycopg://postgres:certificate-ci-only@127.0.0.1:5432/postgres
jobs:
  certificates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: certificate-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Bind checks to the exact source revision
        run: python tools/build_provenance.py snapshot --output qa/certificates/baseline.json --verify-ci --profile qa-postgres --job-id certificates
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/bootstrap.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/qa-postgres.txt
          python -m pip check
      - name: Install Chromium and native browser libraries
        run: python -m playwright install --with-deps chromium
      - name: Require actual Linux confinement before acceptance
        run: python -c "from app.application.self_certificate_sandbox import availability; assert availability(), 'Landlock ABI3+ and libseccomp are required; skipping isolation is not acceptance'"
      - name: Certificate and legacy contracts on SQLite
        run: python -m pytest -q tests/test_self_certificate*.py tests/test_certificates.py tests/test_certificate_test_database.py --junitxml=qa/certificates/sqlite.xml
      - name: Certificate contracts on native PostgreSQL
        env:
          CERTIFICATE_TEST_POSTGRES: 'true'
        run: >-
          python -m pytest -q tests -o 'python_files=test_self_certificate*.py'
          --ignore=tests/test_self_certificate_restore.py
          --ignore=tests/test_self_certificate_browser_improvements.py
          --ignore=tests/test_self_certificate_native_excel_fixture.py
          --junitxml=qa/certificates/postgres.xml
      - name: Actual editor, participant and prepared-share browser journey
        env:
          PX_SELF_CERTIFICATE_BROWSER_ACCEPTANCE: 'YES'
          CERTIFICATE_BROWSER_EVIDENCE: qa/certificates/browser
        run: python -m pytest -q tests/test_self_certificate_browser_improvements.py tests/test_self_certificate_preview_share_browser.py --junitxml=qa/certificates/browser.xml
      - name: Bounded native PostgreSQL load smoke
        env:
          CERTIFICATE_TEST_POSTGRES: 'true'
          RUN_CERTIFICATE_LOAD: '1000'
          CERTIFICATE_LOAD_COUNT: '100'
          CERTIFICATE_LOAD_REPORT: qa/certificates/load-100.json
        run: python -m pytest -q tests/test_self_certificate_load_acceptance.py --junitxml=qa/certificates/load.xml
      - name: Seal certificate evidence and source identity
        if: always()
        run: >-
          python tools/build_provenance.py snapshot
          --baseline qa/certificates/baseline.json
          --output qa/certificates/bundle/provenance.json
          --verify-ci --profile qa-postgres --job-id certificates
          --job-status '${{ job.status }}'
          --evidence qa/certificates/sqlite.xml --require-pass qa/certificates/sqlite.xml
          --evidence qa/certificates/postgres.xml --require-pass qa/certificates/postgres.xml
          --evidence qa/certificates/browser.xml --require-pass qa/certificates/browser.xml
          --evidence qa/certificates/load.xml --require-pass qa/certificates/load.xml
          --evidence qa/certificates/load-100.json --evidence qa/certificates/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certificates-${{ env.SOURCE_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/certificates/
          if-no-files-found: warn
