name: PulseX UIP guest-preview contract static
on:
  pull_request:
    paths:
      - 'reference/integrations/uip-adoption-v1.json'
      - 'reference/integrations/uip-guest-status-preview-v1.json'
      - 'tools/verify_uip_guest_preview.py'
      - '.github/workflows/uip-guest-preview-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Cancel only a pull request run superseded by a newer commit; default-branch runs always finish.
  # A non-PR run gets its own group: a queued default-branch run is never displaced by a newer one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static preview-only / no-guest-export checks
        run: python3 tools/verify_uip_guest_preview.py
