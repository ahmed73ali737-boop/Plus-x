name: PulseX Android APK
on:
  pull_request:
    paths: ['android/**', 'web/guest.mjs', 'web/sw.js', 'tools/build_android_apk.py', '.github/workflows/android-apk.yml']
  push:
    branches: [main]
    paths: ['android/**', 'web/guest.mjs', 'web/sw.js', 'tools/build_android_apk.py', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Verify URL and origin boundary
        run: |
          mkdir -p /tmp/pulsex-jvm
          javac -d /tmp/pulsex-jvm android/app/src/main/java/com/pulsex/app/ServerPolicy.java android/tests/ServerPolicyCheck.java
          java -cp /tmp/pulsex-jvm ServerPolicyCheck
      - name: Build and verify preview signature
        env:
          PULSEX_SOURCE_SHA: ${{ github.sha }}
        run: python3 tools/build_android_apk.py
      - name: Verify offline QR decoder
        run: |
          decoder=android/app/build/manual/zxing-core-3.5.3.jar
          javac -cp "$decoder" -d /tmp/pulsex-jvm android/tests/QrDecoderCheck.java
          java -cp "/tmp/pulsex-jvm:$decoder" QrDecoderCheck
      - uses: actions/upload-artifact@v4
        with:
          name: PulseX-Android-preview-${{ github.sha }}
          path: |
            android/app/build/manual/PulseX-Android-preview.apk
            android/app/build/manual/BUILD_EVIDENCE.json
          if-no-files-found: error
