name: guest-qr-ci

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-identity-and-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and focused QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.0.2 httpx==0.28.1
      - name: Compile Python
        run: python -m compileall -q app
      - name: Check JavaScript modules
        run: |
          node --check web/guest.mjs
          node --check web/app.mjs
          node --check web/public.mjs
          node --check web/offline.mjs
          node --check web/admin.mjs
          node --check web/sw.js
      - name: Guest QR and offline regression
        run: pytest -q tests/test_guest_identity.py tests/test_windows11.py
