name: Harness reliability on Windows and Linux
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/qa.txt
      - name: Run ownership and fault contracts twice in fresh directories
        shell: bash
        run: |
          mkdir -p qa/reliability
          for attempt in 1 2; do
            python -m pytest -q tests/test_upgrade_safety.py tests/test_acceptance_evidence.py tests/test_performance_measurement.py tests/test_public_bundle_query_budget.py tests/test_pwa_install_contract.py tests/test_guest_frontend_security.py tests/test_device_admission_scope.py tests/test_harness_reliability.py tests/test_runtime_recovery.py tests/test_admission_http_ack.py tests/test_admission_gate_integration.py tests/test_linux_standalone_contract.py --basetemp="qa/reliability/temp-$attempt" --junitxml="qa/reliability/run-$attempt.xml" || exit $?
            python tests/guest_capacity_smoke.py > "qa/reliability/guest-$attempt.log" 2>&1 || exit $?
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-reliability-${{ matrix.os }}-${{ github.sha }}
          path: |
            qa/reliability/
            qa/contracts/admission-resilience.log
          if-no-files-found: error
