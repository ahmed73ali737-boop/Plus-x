name: Database read-only catalog safety

on:
  pull_request:
    paths:
      - 'ops/postgresql/**'
      - 'tests/database_architecture/**'
      - '.github/workflows/database-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'ops/postgresql/**'
      - 'tests/database_architecture/**'
      - '.github/workflows/database-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded automatic verification shares a group; manual verification is isolated.
  group: ci-database-readonly-${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || github.event_name == 'schedule' || github.event_name == 'merge_group' }}

jobs:
  source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reject destructive SQL and require bounded read-only diagnostics
        run: python -m unittest discover -s tests/database_architecture -p 'test_*.py' -v
