name: PulseX CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime and QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-qa.txt
      - name: Compile Python
        run: python -m compileall -q app tests tools run.py
      - name: Run pytest suite
        run: python -m pytest -q
      - name: Run local HTTP acceptance
        run: python tests/native_acceptance.py
      - name: Run security hardening smoke
        run: python tests/security_hardening.py
      - name: Check JavaScript syntax
        run: |
          for f in web/*.mjs sdk/javascript/*.mjs tests/*.mjs; do
            [ -f "$f" ] && node --check "$f"
          done
      - name: Run JavaScript SDK tests
        run: node tests/sdk_js_test.mjs

  windows-core:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime and QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-qa.txt
      - name: Compile Python
        run: python -m compileall -q app tests tools run.py
      - name: Run pytest suite on Windows
        run: python -m pytest -q
      - name: Run native Windows HTTP acceptance
        run: python tests/native_acceptance.py

  browser-components:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-qa.txt
          python -m playwright install --with-deps chromium
      - name: Run read-only Chromium component suite
        run: python tests/browser_components.py
      - name: Upload browser QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: |
            qa/browser-components.json
            qa/*.png
          if-no-files-found: ignore

  postgres-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pulsex_test
          POSTGRES_USER: pulsex
          POSTGRES_PASSWORD: pulsex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsex -d pulsex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PX_POSTGRES_TEST_URL: postgresql+psycopg://pulsex:pulsex_ci@127.0.0.1:5432/pulsex_test
      PX_ALLOW_POSTGRES_TEST_RESET: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-postgres.txt -r requirements-qa.txt
      - name: Run PostgreSQL native acceptance
        run: python tests/postgres_native_acceptance.py
      - name: Upload PostgreSQL QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-qa
          path: qa/postgres-native-acceptance.json
          if-no-files-found: ignore
