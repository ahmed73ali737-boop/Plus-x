name: Clean architecture gate

# Fast layer gate for the DDD/clean-architecture refactor: the dependency rule,
# domain rules and use cases with in-memory ports. The full pytest suite, browser
# contracts and native PostgreSQL acceptance stay in pulsex-ci.yml (python-core and
# postgres-native jobs), which this workflow deliberately does not duplicate.
on:
  pull_request:
  push:
    branches: [ main, "refactor/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded automatic verification shares a group; manual verification is isolated.
  group: ci-clean-architecture-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  layers:
    name: Architecture, domain and use-case tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install hash-locked pip bootstrap
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/bootstrap.txt'
      - name: Install QA dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/qa.txt'
      - name: Dependency rule, domain rules and in-memory use cases
        run: python -m pytest -q -p no:cacheprovider tests/test_architecture.py tests/test_domain.py tests/test_use_cases.py
      - name: OpenAPI contract unchanged by the refactor
        run: python -m pytest -q -p no:cacheprovider tests/test_api_contract.py
