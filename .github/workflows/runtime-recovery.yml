name: Runtime recovery acceptance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/qa.txt
      - run: python tests/runtime_recovery_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-recovery-${{ github.sha }}
          path: qa/runtime-recovery/
          if-no-files-found: error
