name: Isolated PostgreSQL upgrade and restore
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONUTF8: "1"
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: pulsex-synthetic-ci-only
          POSTGRES_USER: pulsex
          POSTGRES_DB: pulsex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pulsex -d pulsex_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PX_POSTGRES_TEST_URL: postgresql+psycopg://pulsex:pulsex-synthetic-ci-only@127.0.0.1:5432/pulsex_test
      PX_ALLOW_POSTGRES_TEST_RESET: 'YES'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Record and verify exact checkout identity
        run: python tools/build_provenance.py snapshot --output qa/ci/rehearsal/baseline.json --verify-ci --profile qa-postgres --job-id rehearsal
      - name: Remove only generated evidence from previous checkouts
        run: python -c "from pathlib import Path; import shutil; targets=['qa/ci/rehearsal/source-locks.json', 'qa/ci/rehearsal/bundle', 'qa/upgrade-rehearsal.json', 'qa/postgres-invitations-acceptance.json', 'qa/upgrade-logs']; [(shutil.rmtree(p) if p.is_dir() else p.unlink()) for p in map(Path,targets) if p.exists()]"
      - name: Verify SHA256 observability source lock before dependencies
        run: python tools/verify_shared_observability.py
      - name: Verify Git blob consolidation source lock before dependencies
        run: python tools/verify_consolidation_assets.py
      - name: Exercise independent source locks and negative controls
        run: python tools/source_lock_diagnostics.py --controls --checkouts --output qa/ci/rehearsal/source-locks.json
      - name: Install hash-locked pip bootstrap
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/bootstrap.txt'
      - name: Install hash-locked acceptance dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/qa-postgres.txt'
      - name: Run isolated PostgreSQL migration and restore rehearsal
        shell: bash
        env:
          PX_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -o pipefail
          mkdir -p qa/upgrade-logs
          python tests/postgres_upgrade_rehearsal.py 2>&1 | tee qa/upgrade-logs/rehearsal.log
      - name: Verify PostgreSQL invitation transactions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p qa/upgrade-logs
          python tests/postgres_invitations_acceptance.py 2>&1 | tee qa/upgrade-logs/invitations.log
      - name: Seal exact-source evidence even when a required check fails
        if: always()
        run: python tools/build_provenance.py snapshot --baseline qa/ci/rehearsal/baseline.json --output qa/ci/rehearsal/bundle/provenance.json --verify-ci --profile qa-postgres --job-id rehearsal --job-status '${{ job.status }}' --probe-postgres --evidence 'qa/ci/rehearsal/source-locks.json' --evidence 'qa/upgrade-rehearsal.json' --evidence 'qa/postgres-invitations-acceptance.json' --evidence 'qa/upgrade-logs' --require-pass 'qa/ci/rehearsal/source-locks.json' --require-pass 'qa/upgrade-rehearsal.json' --require-pass 'qa/postgres-invitations-acceptance.json'
      - name: Upload same-run source and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase01-upgrade-rehearsal-${{ env.SOURCE_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa/ci/rehearsal/bundle/
          if-no-files-found: error
      - name: Preserve runner logs and original reports on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase01-diagnostics-upgrade-rehearsal-${{ env.SOURCE_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa/ci/rehearsal/baseline.json
            qa/upgrade-logs
            qa/upgrade-rehearsal.json
            qa/postgres-invitations-acceptance.json
          if-no-files-found: error
