name: Isolated PostgreSQL upgrade and restore
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: pulsex-synthetic-ci-only
          POSTGRES_USER: pulsex
          POSTGRES_DB: pulsex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pulsex -d pulsex_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PX_POSTGRES_TEST_URL: postgresql+psycopg://pulsex:pulsex-synthetic-ci-only@127.0.0.1:5432/pulsex_test
      PX_ALLOW_POSTGRES_TEST_RESET: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/qa-postgres.txt
      - run: python tests/postgres_upgrade_rehearsal.py
        env:
          PX_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: python tests/postgres_invitations_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-upgrade-restore-${{ github.sha }}
          path: |
            qa/upgrade-rehearsal.json
            qa/postgres-invitations-acceptance.json
          if-no-files-found: error
